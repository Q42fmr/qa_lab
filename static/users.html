<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Користувачі — qa_lab</title>
<style>
  :root{
    --bg:#14171c; --panel:#1b1f26; --line:#2a3038; --ink:#d8dce3;
    --dim:#8a93a3; --accent:#c9974a; --err:#c76a5e; --ok:#7dbf7d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:32px 28px 60px;
  }
  h1{ font-size:15px; letter-spacing:.18em; text-transform:uppercase; margin:0 0 4px; }
  h1 b{ color:var(--accent); }
  .sub{ color:var(--dim); font-size:12.5px; margin:0 0 26px; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ text-decoration:underline; }

  .msg{ display:none; margin:0 0 16px; padding:9px 12px; border-radius:6px; font-size:13px; }
  .msg.on{ display:block; }
  .msg.err{ background:rgba(199,106,94,.12); border:1px solid rgba(199,106,94,.4); color:var(--err); }
  .msg.ok{ background:rgba(125,191,125,.1); border:1px solid rgba(125,191,125,.35); color:var(--ok); }

  table{ width:100%; border-collapse:collapse; margin:0 0 30px; }
  th{
    text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); font-weight:600; padding:0 10px 7px 0;
    border-bottom:1px solid var(--line);
  }
  td{ padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.off td{ opacity:.45; }
  .login{ font-family:Consolas,monospace; }
  .tag{
    display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px;
    border:1px solid var(--line); color:var(--dim);
  }
  .tag.admin{ color:var(--accent); border-color:rgba(201,151,74,.5); }
  .tag.slack{ color:#5ba7c9; border-color:rgba(91,167,201,.45); }

  button{
    padding:5px 11px; border-radius:5px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font:inherit; font-size:12.5px;
    cursor:pointer;
  }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#1a140a; border-color:transparent; font-weight:600; }
  button:disabled{ opacity:.5; cursor:default; }

  fieldset{
    border:1px solid var(--line); border-radius:8px; padding:18px 20px 20px;
    max-width:560px; margin:0;
  }
  legend{ padding:0 8px; color:var(--accent); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .row{ display:flex; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:150px; }
  label{ display:block; font-size:11.5px; color:var(--dim); margin:0 0 4px; }
  input[type=text],input[type=password]{
    width:100%; padding:8px 10px; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:5px; font:inherit; font-size:13px;
  }
  input:focus{ outline:none; border-color:var(--accent); }
  .check{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); }
  .note{ color:var(--dim); font-size:11.5px; margin:6px 0 0; }
</style>
<script src="/i18n-dict.js"></script>
<script src="/i18n.js"></script>
</head>
<body>

<h1><span style="text-transform:none">qa<b>_lab</b></span> — користувачі</h1>
<p class="sub"><a href="/">← до лаби</a> · права у всіх однакові, крім адміністратора<span data-i18n-slot style="margin-left:10px"></span></p>

<div id="msg" class="msg"></div>

<table>
  <thead>
    <tr><th>Логін</th><th>Ім'я</th><th>Вхід</th><th>Останній вхід</th><th></th></tr>
  </thead>
  <tbody id="rows"><tr><td colspan="5" style="color:var(--dim)">завантаження…</td></tr></tbody>
</table>

<fieldset>
  <legend>Новий користувач</legend>
  <div class="row">
    <div><label for="nLogin">Логін</label><input id="nLogin" type="text" autocomplete="off"></div>
    <div><label for="nName">Ім'я</label><input id="nName" type="text" autocomplete="off"></div>
  </div>
  <div class="row">
    <div><label for="nPass">Пароль (від 8 символів)</label><input id="nPass" type="password" autocomplete="new-password"></div>
    <div><label for="nSlack">Slack ID (необов'язково)</label><input id="nSlack" type="text" placeholder="U01ABCDEF" autocomplete="off"></div>
  </div>
  <div class="row"><div class="check"><input id="nAdmin" type="checkbox"><label for="nAdmin" style="margin:0">адміністратор</label></div></div>
  <button class="primary" id="create">Створити</button>
  <p class="note">Хто заходить через Slack, створюється сам — заводити руками треба лише тих, хто входитиме логіном і паролем.</p>
</fieldset>

<script>
const $ = id => document.getElementById(id);
let me = null;

function say(text, kind){
  const box = $('msg');
  box.textContent = text || '';
  box.className = 'msg' + (text ? ' on ' + (kind || 'err') : '');
}

async function api(url, opts){
  const r = await fetch(url, opts);
  if (r.status === 401) { location.replace('/login'); throw new Error('401'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('помилка ' + r.status));
  return data;
}

function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function render(list){
  const tb = $('rows');
  tb.innerHTML = '';
  if (!list.length) { tb.innerHTML = '<tr><td colspan="5" style="color:var(--dim)">порожньо</td></tr>'; return; }
  for (const u of list) {
    const tr = document.createElement('tr');
    if (!u.is_active) tr.className = 'off';

    // «Вхід» — чим людина може зайти. Порожньо означає, що акаунт заведено
    // руками без пароля і без Slack, тобто увійти зараз неможливо.
    const ways = [];
    if (u.has_password) ways.push('<span class="tag">пароль</span>');
    if (u.slack_user_id) ways.push('<span class="tag slack">slack</span>');
    // Свій токен ClickUp — видно ЩО він є, але не значення: воно не виходить
    // за межі сервера жодним ендпоінтом.
    if (u.has_clickup_token) ways.push('<span class="tag">clickup</span>');
    if (u.is_admin) ways.unshift('<span class="tag admin">адмін</span>');

    tr.innerHTML =
      '<td class="login">' + esc(u.login) + '</td>' +
      '<td>' + esc(u.name || '') + '</td>' +
      '<td>' + (ways.join(' ') || '<span class="tag">—</span>') + '</td>' +
      '<td style="color:var(--dim)">' + esc(u.last_login_at || 'ніколи') + '</td>';

    const td = document.createElement('td');
    td.style.textAlign = 'right';
    td.style.whiteSpace = 'nowrap';

    const pw = document.createElement('button');
    pw.textContent = 'пароль';
    pw.title = 'задати новий пароль';
    pw.onclick = async () => {
      const v = prompt('Новий пароль для ' + u.login + ' (від 8 символів):');
      if (!v) return;
      try { await api('/api/users/' + u.id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: v})});
            say('пароль змінено: ' + u.login, 'ok'); load(); }
      catch (e) { say(e.message); }
    };
    td.appendChild(pw);

    const tg = document.createElement('button');
    tg.textContent = u.is_active ? 'вимкнути' : 'увімкнути';
    tg.style.marginLeft = '6px';
    tg.disabled = (me && u.id === me.id);
    if (tg.disabled) tg.title = 'власну учетку вимкнути не можна';
    tg.onclick = async () => {
      try { await api('/api/users/' + u.id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({is_active: !u.is_active})});
            load(); }
      catch (e) { say(e.message); }
    };
    td.appendChild(tg);

    tr.appendChild(td);
    tb.appendChild(tr);
  }
}

async function load(){
  try {
    const info = await api('/api/auth/me');
    me = info.user;
    render(await api('/api/users'));
  } catch (e) {
    if (e.message !== '401') say(e.message);
  }
}

$('create').onclick = async () => {
  say('');
  const body = {
    login: $('nLogin').value.trim(),
    name: $('nName').value.trim(),
    is_admin: $('nAdmin').checked,
  };
  const pass = $('nPass').value;
  const slack = $('nSlack').value.trim();
  if (pass) body.password = pass;
  if (slack) body.slack_user_id = slack;
  if (!body.login) { say('порожній логін'); return; }
  try {
    await api('/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    ['nLogin','nName','nPass','nSlack'].forEach(id => $(id).value = '');
    $('nAdmin').checked = false;
    say('створено: ' + body.login, 'ok');
    load();
  } catch (e) { say(e.message); }
};

load();
</script>
</body>
</html>
